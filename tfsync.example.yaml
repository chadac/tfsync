# tfsync configuration example
# See README.md for full documentation

version: "1"

# Source: where to pull state from (uses configured backend)
source:
  path: ./terraform/old

# Target: where to test the migration (uses local state)
target:
  path: ./terraform/new

# Migration: how to transform the state
migration:
  # Inline state moves (recommended)
  moves:
    - from: "aws_s3_bucket.data"
      to: "module.storage.aws_s3_bucket.main"
    - from: "aws_iam_role.app"
      to: "module.iam.aws_iam_role.application"

  # Or use an external script for complex migrations
  # script: ./migrate.sh

# Optional: terraform/tofu settings
terraform:
  binary: tofu          # or "terraform"
  parallelism: 10
  # var_files:
  #   - terraform.tfvars
  # vars:
  #   - "environment=test"

# Optional: cleanup behavior
cleanup:
  on_success: true
  on_failure: false

